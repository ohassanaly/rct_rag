name: Deploy to Render (after tests workflow)

on:
  workflow_run:
    workflows: ["Search Engine App"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'retrieval/prod' }}
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: true
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
